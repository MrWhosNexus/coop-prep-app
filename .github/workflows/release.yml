name: Release

# Tag a version, get installers for all three operating systems.
#
#   npm version minor -m "chore: v%s"   # bumps package.json, commits, tags
#   git push --follow-tags
#
# Each OS builds its own artifacts — electron-builder cannot produce a signed,
# working .dmg from Linux, and a Windows NSIS installer built elsewhere is a
# different thing from one built on Windows. Cross-building is where "it works
# on my machine" becomes "it works on the CI runner's machine".
#
# The release is created as a DRAFT. Nothing reaches the cohort until a human
# opens it, reads the notes, and clicks publish — and until it is published,
# electron-updater does not see it, so a half-uploaded matrix never ships.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        # A release that fails its own suite must not reach anyone, and a tag is
        # the last place to find that out.
        run: npm test

      - name: Build and publish
        # electron-builder reads the `publish:` block in electron-builder.yml —
        # the same owner/repo pinned in electron/updates/updater.js — and uploads
        # the artifacts plus the latest*.yml metadata the updater reads. That
        # metadata carries the SHA-512 of every artifact, which is what makes an
        # update verifiable rather than merely downloaded.
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds are unsigned: there is no Apple Developer ID and no Windows
          # certificate for this project. Saying so explicitly stops
          # electron-builder from trying to sign with whatever identity it finds
          # on the runner, and stops it failing the build when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Checksums
        # In Node, not shasum. The first version of this step used
        # `shasum -a 512` and failed ONLY on Windows: the GitHub Windows runner's
        # Git Bash has no shasum, the `|| true` swallowed it, and the step wrote
        # a 0-byte file that the upload below then rejected with
        # "HTTP 400: Bad Content-Length" — a confusing error two steps removed
        # from its cause. Node is already set up on every runner and behaves
        # identically on all three.
        #
        # No `|| true` anywhere now. A checksum step that cannot fail is a
        # checksum step that silently publishes nothing, and for unsigned builds
        # these hashes are the ONLY integrity story a downloader has.
        shell: bash
        run: |
          node -e "
            const fs = require('fs'), crypto = require('crypto'), path = require('path');
            const dir = 'dist-electron';
            const exts = ['.dmg', '.exe', '.AppImage', '.deb', '.zip'];
            const files = fs.readdirSync(dir).filter(f => exts.includes(path.extname(f))).sort();
            if (!files.length) throw new Error('no installers found in ' + dir + ' — the build produced nothing to checksum');
            const lines = files.map(f => {
              const hash = crypto.createHash('sha512').update(fs.readFileSync(path.join(dir, f))).digest('hex');
              return hash + '  ' + f;
            });
            const out = path.join(dir, 'SHA512SUMS-${{ matrix.os }}.txt');
            fs.writeFileSync(out, lines.join('\n') + '\n');
            console.log(lines.join('\n'));
          "

      - name: Attach checksums to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" "dist-electron/SHA512SUMS-${{ matrix.os }}.txt" --clobber
